name: Update APT repo

on:
  schedule:
    - cron: "23 4 * * *"          # daily at 04:23 UTC
  workflow_dispatch:               # can be started manually (Actions tab -> Run workflow)
  push:
    branches: [main]
    paths:
      - apps.txt
      - scripts/**
      - .github/workflows/update-apt-repo.yml

# Never run two deployments at once; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro jq gnupg

      - name: Build and sign the repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}          # optional; default: https://<owner>.github.io/<repo>
        run: ./scripts/build-repo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
